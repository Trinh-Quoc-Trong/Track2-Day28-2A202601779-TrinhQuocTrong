services:
  otel-collector:
    environment:
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:?set LANGSMITH_API_KEY to enable export}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-lab28-platform}
    volumes:
      - ./monitoring/otel-collector-langsmith.yaml:/etc/otelcol/config.yaml:ro
